 
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물 분자 공유결합 시뮬레이션</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(90deg, #a8edea, #fed6e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 20px;
            text-align: center;
        }

        .info-box {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 14px 24px;
            margin-bottom: 20px;
            max-width: 620px;
            width: 100%;
            font-size: 0.92rem;
            line-height: 1.7;
            color: #ddd;
        }

        .info-box strong { color: #a8edea; }

        canvas {
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        #bondBtn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            box-shadow: 0 4px 15px rgba(245,87,108,0.4);
        }

        #bondBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245,87,108,0.6);
        }

        #bondBtn:disabled { opacity: 0.7; cursor: default; }

        #resetBtn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            box-shadow: 0 4px 15px rgba(79,172,254,0.4);
        }

        #resetBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79,172,254,0.6);
        }

        .step-indicator {
            margin-top: 14px;
            font-size: 1rem;
            color: #fed6e3;
            min-height: 28px;
            text-align: center;
            font-weight: 500;
        }

        .legend {
            display: flex;
            gap: 24px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: #ccc;
        }

        .legend-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

<h1>💧 물 분자 공유결합 시뮬레이션</h1>
<p class="subtitle">수소(H)와 산소(O)가 전자쌍을 공유하여 물(H₂O)이 되는 과정</p>

<div class="info-box">
    <strong>공유결합이란?</strong> 비금속 원자들이 서로 전자쌍을 공유하여 안정한 전자 배치를 이루는 결합입니다.<br>
    🔵 <strong>산소(O)</strong>: 전자 6개 → 전자 2개가 부족 (8개 필요)<br>
    🔴 <strong>수소(H)</strong>: 전자 1개 → 전자 1개가 부족 (2개 필요)<br>
    ✨ 수소 2개 + 산소 1개 → 전자쌍 <strong>2쌍 공유</strong> → 물 분자(H₂O) 형성!
</div>

<canvas id="simCanvas" width="620" height="440"></canvas>

<div class="legend">
    <div class="legend-item">
        <div class="legend-dot" style="background:#5b9bd5;"></div> 산소(O) 전자
    </div>
    <div class="legend-item">
        <div class="legend-dot" style="background:#ff6b6b;"></div> 수소1(H₁) 전자
    </div>
    <div class="legend-item">
        <div class="legend-dot" style="background:#ffd93d;"></div> 수소2(H₂) 전자
    </div>
</div>

<div class="controls">
    <button id="bondBtn">⚡ 공유결합 시작!</button>
    <button id="resetBtn">🔄 처음으로</button>
</div>

<div class="step-indicator" id="stepText">버튼을 눌러 공유결합 과정을 시작하세요!</div>

<script>
const canvas   = document.getElementById('simCanvas');
const ctx      = canvas.getContext('2d');
const stepText = document.getElementById('stepText');
const bondBtn  = document.getElementById('bondBtn');
const resetBtn = document.getElementById('resetBtn');

// ═══════════════════════════════════════════
//  104.5° 결합각으로 H1·H2 위치 정확히 계산
// ═══════════════════════════════════════════
const BOND_ANGLE_DEG = 104.5;
const HALF_ANGLE     = (BOND_ANGLE_DEG / 2) * (Math.PI / 180);
const BOND_LEN       = 118;
const BASE_ANGLE     = Math.PI;

const OFinal  = { x: 370, y: 220 };
const H1Final = {
    x: OFinal.x + BOND_LEN * Math.cos(BASE_ANGLE - HALF_ANGLE),
    y: OFinal.y + BOND_LEN * Math.sin(BASE_ANGLE - HALF_ANGLE)
};
const H2Final = {
    x: OFinal.x + BOND_LEN * Math.cos(BASE_ANGLE + HALF_ANGLE),
    y: OFinal.y + BOND_LEN * Math.sin(BASE_ANGLE + HALF_ANGLE)
};

const initPos = {
    O:  { x: 370, y: 220 },
    H1: { x: 90,  y: 110 },
    H2: { x: 90,  y: 330 },
};
const bondPos = {
    O:  { ...OFinal  },
    H1: { ...H1Final },
    H2: { ...H2Final },
};

// ═══════════════════════════════════════════
//  플러스 아이콘 펄스용 상태
//  plusPop : 0→1 애니메이션 진행도
// ═══════════════════════════════════════════
let phase         = 0;
let t             = 0;
let electronAngle = 0;
let plusPop       = 0;   // 0~1, 결합 완성 직후 팝 애니메이션
let plusPulse     = 0;   // 완성 후 지속 펄스

// ──────── 유틸 ────────
function lerp(a, b, t) { return a + (b - a) * t; }

function lightenColor(hex, amt) {
    let r = Math.min(255, parseInt(hex.slice(1,3),16) + amt);
    let g = Math.min(255, parseInt(hex.slice(3,5),16) + amt);
    let b = Math.min(255, parseInt(hex.slice(5,7),16) + amt);
    return `rgb(${r},${g},${b})`;
}

// ──────── 원자 ────────
function drawAtom(x, y, r, color, glow, label, subLabel) {
    if (glow) {
        let gr = ctx.createRadialGradient(x, y, r*0.5, x, y, r*2);
        gr.addColorStop(0, glow);
        gr.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(x, y, r*2, 0, Math.PI*2);
        ctx.fillStyle = gr;
        ctx.fill();
    }
    let gr = ctx.createRadialGradient(x-r*0.3, y-r*0.3, r*0.1, x, y, r);
    gr.addColorStop(0, lightenColor(color, 60));
    gr.addColorStop(1, color);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = 'white';
    ctx.font = `bold ${r*0.75}px Segoe UI`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y);
    if (subLabel) {
        ctx.font = `${r*0.42}px Segoe UI`;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText(subLabel, x, y + r*0.98);
    }
}

// ──────── 전자껍질 ────────
function drawElectronShell(cx, cy, radius, count, color, angleOffset, eR) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 0; i < count; i++) {
        let a  = angleOffset + (Math.PI*2/count)*i;
        let ex = cx + radius*Math.cos(a);
        let ey = cy + radius*Math.sin(a);
        ctx.beginPath();
        ctx.arc(ex, ey, eR, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

// ──────── 부족 레이블 ────────
function drawNeedLabel(x, y, text, color) {
    ctx.save();
    ctx.font = '13px Segoe UI';
    let w = ctx.measureText(text).width + 16;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.roundRect(x - w/2, y - 10, w, 20, 6);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
}

// ──────── 화살표 ────────
function drawArrow(x1, y1, x2, y2, color) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash([5,4]);
    ctx.stroke();
    ctx.setLineDash([]);
    let angle = Math.atan2(y2-y1, x2-x1);
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 10*Math.cos(angle-0.4), y2 - 10*Math.sin(angle-0.4));
    ctx.lineTo(x2 - 10*Math.cos(angle+0.4), y2 - 10*Math.sin(angle+0.4));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
}

// ══════════════════════════════════════════════════
//  ★ 플러스 아이콘 그리기
//    cx, cy   : 중심 좌표
//    size     : 아이콘 반지름
//    alpha    : 투명도 (0~1)
//    scale    : 팝 스케일 (0~1+)
//    color1   : 왼쪽(H) 전자색
//    color2   : 오른쪽(O) 전자색
//    label    : 아래 설명 텍스트
// ══════════════════════════════════════════════════
function drawPlusIcon(cx, cy, size, alpha, scale, color1, color2, label) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    const arm  = size * 0.52;   // 십자 막대 길이
    const half = size * 0.22;   // 십자 막대 두께의 절반
    const r    = size;          // 원 반지름

    // ── 배경 원 (그라데이션) ──
    let bg = ctx.createRadialGradient(0, 0, r*0.2, 0, 0, r);
    bg.addColorStop(0, 'rgba(60,60,100,0.95)');
    bg.addColorStop(1, 'rgba(20,20,50,0.85)');
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fillStyle = bg;
    ctx.fill();

    // 테두리 그라데이션 (color1→color2)
    let stroke = ctx.createLinearGradient(-r, 0, r, 0);
    stroke.addColorStop(0, color1);
    stroke.addColorStop(1, color2);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 3;
    ctx.stroke();

    // ── 십자(+) 모양 ──
    let plusGrad = ctx.createLinearGradient(-arm, 0, arm, 0);
    plusGrad.addColorStop(0, color1);
    plusGrad.addColorStop(0.5, '#ffffff');
    plusGrad.addColorStop(1, color2);

    ctx.beginPath();
    // 가로 막대
    ctx.moveTo(-arm,  -half);
    ctx.lineTo( arm,  -half);
    ctx.lineTo( arm,   half);
    ctx.lineTo(-arm,   half);
    ctx.closePath();
    // 세로 막대
    ctx.moveTo(-half, -arm);
    ctx.lineTo( half, -arm);
    ctx.lineTo( half,  arm);
    ctx.lineTo(-half,  arm);
    ctx.closePath();
    ctx.fillStyle = plusGrad;
    ctx.fill();

    // ── 작은 전자 두 개 (공유를 상징) ──
    // 왼쪽 전자 (수소 전자)
    ctx.beginPath();
    ctx.arc(-size*0.52, 0, size*0.16, 0, Math.PI*2);
    ctx.fillStyle = color1;
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 오른쪽 전자 (산소 전자)
    ctx.beginPath();
    ctx.arc( size*0.52, 0, size*0.16, 0, Math.PI*2);
    ctx.fillStyle = color2;
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // ── 펄스 링 ──
    let pulseR = r + 6 + Math.sin(plusPulse) * 5;
    ctx.beginPath();
    ctx.arc(0, 0, pulseR, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,255,255,${0.25 + 0.15*Math.sin(plusPulse)})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();

    // ── 아래 설명 레이블 ──
    if (label && alpha > 0.5) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = 'bold 11px Segoe UI';
        let tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.roundRect(cx - tw/2 - 6, cy + size*scale + 6, tw + 12, 18, 5);
        ctx.fill();
        ctx.fillStyle = '#fffde7';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, cx, cy + size*scale + 15);
        ctx.restore();
    }
}

// ──────── 결합선 ────────
function drawBondLine(x1, y1, x2, y2) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();
    let dx = y2-y1, dy = -(x2-x1);
    let len = Math.sqrt(dx*dx+dy*dy);
    dx /= len; dy /= len;
    ctx.beginPath();
    ctx.moveTo(x1+dx*4, y1+dy*4);
    ctx.lineTo(x2+dx*4, y2+dy*4);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
}

// ──────── 공유전자쌍 ────────
function drawSharedPair(x1, y1, x2, y2, angle, color1, color2, label) {
    let mx  = x1*0.55 + x2*0.45;
    let my  = y1*0.55 + y2*0.45;
    let dx  = x2-x1, dy = y2-y1;
    let len = Math.sqrt(dx*dx+dy*dy);
    let nx  = -dy/len * 9;
    let ny  =  dx/len * 9;
    let off = Math.sin(angle*2) * 3;

    ctx.beginPath();
    ctx.arc(mx+nx+off, my+ny+off, 6, 0, Math.PI*2);
    ctx.fillStyle = color1;
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(mx-nx-off, my-ny-off, 6, 0, Math.PI*2);
    ctx.fillStyle = color2;
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    let lx = mx + nx*4;
    let ly = my + ny*4 - 14;
    ctx.save();
    ctx.font = 'bold 11px Segoe UI';
    let tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(lx - tw/2 - 5, ly - 9, tw+10, 16);
    ctx.fillStyle = '#fed6e3';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, lx, ly+2);
    ctx.restore();
}

// ──────── 비공유전자쌍 ────────
function drawLonePair(cx, cy, angle) {
    let off = Math.sin(angle*2.5) * 2;
    for (let i = -1; i <= 1; i += 2) {
        ctx.beginPath();
        ctx.arc(cx + i*7 + off, cy, 5, 0, Math.PI*2);
        ctx.fillStyle = '#5b9bd5';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

// ──────── 결합각 호 ────────
function drawAngleArc(ox, oy, h1x, h1y, h2x, h2y) {
    let a1 = Math.atan2(h1y-oy, h1x-ox);
    let a2 = Math.atan2(h2y-oy, h2x-ox);
    if (a1 > a2) [a1, a2] = [a2, a1];

    ctx.save();
    ctx.beginPath();
    ctx.arc(ox, oy, 56, a1, a2);
    ctx.strokeStyle = 'rgba(255,220,100,0.85)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5,3]);
    ctx.stroke();
    ctx.setLineDash([]);

    let mid = (a1+a2)/2;
    let lx  = ox + 76*Math.cos(mid);
    let ly  = oy + 76*Math.sin(mid);
    ctx.font = 'bold 14px Segoe UI';
    ctx.fillStyle = '#ffd93d';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('104.5°', lx, ly);
    ctx.restore();
}

// ──────── 정보 패널 ────────
function drawInfoPanel() {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.roundRect(12, canvas.height-72, 230, 60, 10);
    ctx.fill();
    ctx.font = 'bold 12px Segoe UI';
    ctx.fillStyle = '#a8edea';
    ctx.textAlign = 'left';
    ctx.fillText('✅ 공유결합 완성!', 22, canvas.height-52);
    ctx.fillStyle = '#ddd';
    ctx.font = '11px Segoe UI';
    ctx.fillText('● 공유전자쌍: 2쌍 (단일결합 ×2)', 22, canvas.height-36);
    ctx.fillText('● 비공유전자쌍: 2쌍 (산소)', 22, canvas.height-22);
    ctx.restore();
}

// ══════════════════════════════
//  Phase 0 : 초기 상태
// ══════════════════════════════
function drawInitial() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let ea = electronAngle;

    drawElectronShell(initPos.O.x,  initPos.O.y,  52, 2, '#5b9bd5', ea,       5);
    drawElectronShell(initPos.O.x,  initPos.O.y,  78, 6, '#5b9bd5', ea+0.4,   5);
    drawAtom(initPos.O.x,  initPos.O.y,  32, '#1a6fb5', 'rgba(91,155,213,0.3)', 'O', '전자6개');

    drawElectronShell(initPos.H1.x, initPos.H1.y, 42, 1, '#ff6b6b', ea, 5);
    drawAtom(initPos.H1.x, initPos.H1.y, 22, '#c0392b', 'rgba(255,107,107,0.25)', 'H', '전자1개');

    drawElectronShell(initPos.H2.x, initPos.H2.y, 42, 1, '#ffd93d', ea, 5);
    drawAtom(initPos.H2.x, initPos.H2.y, 22, '#e67e22', 'rgba(255,217,61,0.25)', 'H', '전자1개');

    drawNeedLabel(initPos.O.x,  initPos.O.y  - 95, '전자 2개 부족', '#a8edea');
    drawNeedLabel(initPos.H1.x, initPos.H1.y - 65, '전자 1개 부족', '#ffb3b3');
    drawNeedLabel(initPos.H2.x, initPos.H2.y + 65, '전자 1개 부족', '#ffe08a');
}

// ══════════════════════════════
//  Phase 1 : 접근 애니메이션
// ══════════════════════════════
function drawApproach(progress) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (progress < 0.6) {
        let alpha = Math.sin(progress * Math.PI);
        ctx.save();
        ctx.globalAlpha = alpha;
        drawArrow(initPos.H1.x+30, initPos.H1.y, bondPos.O.x-100, bondPos.H1.y, '#ff6b6b');
        drawArrow(initPos.H2.x+30, initPos.H2.y, bondPos.O.x-100, bondPos.H2.y, '#ffd93d');
        ctx.restore();
    }

    let ox  = lerp(initPos.O.x,  bondPos.O.x,  progress);
    let oy  = lerp(initPos.O.y,  bondPos.O.y,  progress);
    let h1x = lerp(initPos.H1.x, bondPos.H1.x, progress);
    let h1y = lerp(initPos.H1.y, bondPos.H1.y, progress);
    let h2x = lerp(initPos.H2.x, bondPos.H2.x, progress);
    let h2y = lerp(initPos.H2.y, bondPos.H2.y, progress);

    let ea = electronAngle;
    drawElectronShell(ox, oy, 52, 2, '#5b9bd5', ea,       5);
    drawElectronShell(ox, oy, 78, 6, '#5b9bd5', ea+0.4,   5);
    drawAtom(ox, oy, 32, '#1a6fb5', 'rgba(91,155,213,0.3)', 'O', '');

    drawElectronShell(h1x, h1y, 42, 1, '#ff6b6b', ea, 5);
    drawAtom(h1x, h1y, 22, '#c0392b', 'rgba(255,107,107,0.25)', 'H', '');

    drawElectronShell(h2x, h2y, 42, 1, '#ffd93d', ea, 5);
    drawAtom(h2x, h2y, 22, '#e67e22', 'rgba(255,217,61,0.25)', 'H', '');

    // ── 접근 중 플러스 아이콘 서서히 등장 ──
    // H1 ↔ O 중간
    let m1x = (h1x + ox) / 2;
    let m1y = (h1y + oy) / 2;
    // H2 ↔ O 중간
    let m2x = (h2x + ox) / 2;
    let m2y = (h2y + oy) / 2;

    let pAlpha = Math.max(0, (progress - 0.35) / 0.65);
    // 팝 스케일: 처음엔 작게 나타났다가 1로 수렴
    let pScale = 0.4 + 0.6 * Math.min(1, (progress - 0.35) / 0.4);

    drawPlusIcon(m1x, m1y, 18, pAlpha, pScale, '#ff6b6b', '#5b9bd5', '전자쌍 공유 중');
    drawPlusIcon(m2x, m2y, 18, pAlpha, pScale, '#ffd93d', '#5b9bd5', '전자쌍 공유 중');
}

// ══════════════════════════════
//  Phase 2 : 결합 완성
// ══════════════════════════════
function drawBonded() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const Ox  = bondPos.O.x,  Oy  = bondPos.O.y;
    const H1x = bondPos.H1.x, H1y = bondPos.H1.y;
    const H2x = bondPos.H2.x, H2y = bondPos.H2.y;

    // 결합선
    drawBondLine(H1x, H1y, Ox, Oy);
    drawBondLine(H2x, H2y, Ox, Oy);

    // 산소 내부 전자껍질
    drawElectronShell(Ox, Oy, 52, 2, '#5b9bd5', electronAngle+Math.PI/2, 4);

    // 원자
    drawAtom(Ox,  Oy,  32, '#1a6fb5', 'rgba(91,155,213,0.35)', 'O', '');
    drawAtom(H1x, H1y, 22, '#c0392b', 'rgba(255,107,107,0.3)',  'H', '');
    drawAtom(H2x, H2y, 22, '#e67e22', 'rgba(255,217,61,0.3)',   'H', '');

    // 공유전자쌍 점
    drawSharedPair(H1x, H1y, Ox, Oy, electronAngle, '#ff6b6b', '#5b9bd5', '공유전자쌍①');
    drawSharedPair(H2x, H2y, Ox, Oy, electronAngle, '#ffd93d', '#5b9bd5', '공유전자쌍②');

    // ── ★ 플러스 아이콘 (결합 중간) ──
    // H1 ↔ O 의 60% 지점 (원자 겹치지 않도록)
    let plus1x = H1x*0.38 + Ox*0.62;
    let plus1y = H1y*0.38 + Oy*0.62;
    let plus2x = H2x*0.38 + Ox*0.62;
    let plus2y = H2y*0.38 + Oy*0.62;

    // 팝 스케일: 0→1.25→1.0 으로 바운스
    let popScale1, popScale2;
    if (plusPop < 1) {
        // 팝 등장 단계
        let ease = plusPop < 0.6
            ? 1.25 * (plusPop / 0.6)
            : 1.25 - 0.25 * ((plusPop - 0.6) / 0.4);
        popScale1 = ease;
        popScale2 = ease;
    } else {
        // 완성 후 지속 미세 펄스
        popScale1 = 1.0 + 0.06 * Math.sin(plusPulse);
        popScale2 = 1.0 + 0.06 * Math.sin(plusPulse + 1.0);
    }

    drawPlusIcon(plus1x, plus1y, 20, 1.0, popScale1, '#ff6b6b', '#5b9bd5', 'H₁ 전자쌍 공유');
    drawPlusIcon(plus2x, plus2y, 20, 1.0, popScale2, '#ffd93d', '#5b9bd5', 'H₂ 전자쌍 공유');

    // 비공유전자쌍
    drawLonePair(Ox+44, Oy-18, electronAngle);
    drawLonePair(Ox+44, Oy+18, electronAngle);

    ctx.save();
    ctx.font = '11px Segoe UI';
    ctx.fillStyle = '#a8edea';
    ctx.textAlign = 'left';
    ctx.fillText('비공유전자쌍', Ox+58, Oy-22);
    ctx.fillText('비공유전자쌍', Ox+58, Oy+22);
    ctx.restore();

    // 결합각
    drawAngleArc(Ox, Oy, H1x, H1y, H2x, H2y);

    // H₂O 타이틀
    ctx.save();
    ctx.font = 'bold 26px Segoe UI';
    ctx.fillStyle = 'rgba(168,237,234,0.95)';
    ctx.textAlign = 'center';
    ctx.fillText('H₂O (물 분자)', canvas.width/2, 44);
    ctx.restore();

    drawInfoPanel();
}

// ══════════════════════════════
//  애니메이션 루프
// ══════════════════════════════
function animate() {
    electronAngle += 0.025;

    if (phase === 0) {
        drawInitial();
    } else if (phase === 1) {
        t += 0.012;
        let progress = Math.min(t, 1);
        drawApproach(progress);
        if (progress >= 1) {
            phase = 2;
            plusPop = 0;
            stepText.textContent = '✅ 공유결합 완성! 수소 2개와 산소 1개가 전자쌍을 공유하여 물(H₂O)이 됐어요!';
            bondBtn.textContent  = '✅ 결합 완성!';
            bondBtn.disabled     = true;
        } else {
            stepText.textContent = `⚡ 원자들이 서로 접근 중... (${Math.round(progress*100)}%)`;
        }
    } else if (phase === 2) {
        if (plusPop < 1) plusPop = Math.min(1, plusPop + 0.03);
        plusPulse += 0.06;
        drawBonded();
    }

    requestAnimationFrame(animate);
}

// ══════════════════════════════
//  버튼 이벤트
// ══════════════════════════════
bondBtn.addEventListener('click', () => {
    if (phase === 0) {
        phase = 1;
        t = 0;
        bondBtn.textContent  = '⚡ 결합 진행중...';
        bondBtn.disabled     = true;
        stepText.textContent = '⚡ 수소 원자들이 산소 원자에 접근하고 있어요!';
    }
});

resetBtn.addEventListener('click', () => {
    phase = 0;
    t     = 0;
    electronAngle = 0;
    plusPop   = 0;
    plusPulse = 0;
    bondBtn.textContent  = '⚡ 공유결합 시작!';
    bondBtn.disabled     = false;
    stepText.textContent = '버튼을 눌러 공유결합 과정을 시작하세요!';
});

animate();
</script>
